name: evolution-go

# Este compose sobe APENAS a aplicação.
# PostgreSQL, RabbitMQ e S3 são serviços externos (fora deste compose).
# Preencha os valores em um arquivo .env ao lado deste arquivo (veja .env.my.example).

networks:
  dokploy-network:
    name: dokploy-network
    external: true

services:
  evolution-go:
    # Build a partir do fonte local (raiz do repo, dois níveis acima deste arquivo).
    # O contexto é resolvido relativo à localização do compose, não ao cwd.
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    image: evolution-go:local
    container_name: evolution-go
    restart: unless-stopped
    ports:
      - "4000:4000"
    # Permite alcançar serviços rodando no host da máquina via host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Servidor
      SERVER_PORT: 4000
      CLIENT_NAME: ${CLIENT_NAME:-evolution}

      # Segurança
      GLOBAL_API_KEY: ${GLOBAL_API_KEY:?defina GLOBAL_API_KEY no .env}

      # ------------------------------------------------------------------
      # PostgreSQL EXTERNO
      # Ex.: postgresql://usuario:senha@meu-host:5432/evogo_auth?sslmode=disable
      # Use sslmode=disable para Postgres na mesma rede Docker (sem TLS no servidor)
      # e sslmode=require apenas para bancos gerenciados/expostos (RDS, Neon, etc).
      # ------------------------------------------------------------------
      POSTGRES_AUTH_DB: ${POSTGRES_AUTH_DB:?defina POSTGRES_AUTH_DB no .env}
      POSTGRES_USERS_DB: ${POSTGRES_USERS_DB:?defina POSTGRES_USERS_DB no .env}
      DATABASE_SAVE_MESSAGES: ${DATABASE_SAVE_MESSAGES:-false}

      # Logs e Debug
      WADEBUG: ${WADEBUG:-INFO}
      LOGTYPE: "console"
      LOG_DIRECTORY: "/app/logs"
      LOG_MAX_SIZE: "100"
      LOG_MAX_BACKUPS: "5"
      LOG_MAX_AGE: "30"
      LOG_COMPRESS: "true"

      # Conexão
      CONNECT_ON_STARTUP: "false"
      WEBHOOK_FILES: "true"

      # Sistema
      OS_NAME: "Linux"

      # Webhook (global — deixe vazio; webhooks são configurados por instância via API)
      WEBHOOK_URL: ${WEBHOOK_URL:-}

      # ------------------------------------------------------------------
      # RabbitMQ EXTERNO
      # Ex.: amqps://usuario:senha@meu-host:5671/meu-vhost  (TLS)
      #      amqp://usuario:senha@meu-host:5672/meu-vhost   (sem TLS)
      # Obs.: vhost "/" precisa ser escapado como %2F na URL.
      # ------------------------------------------------------------------
      AMQP_URL: ${AMQP_URL:?defina AMQP_URL no .env}
      AMQP_GLOBAL_ENABLED: ${AMQP_GLOBAL_ENABLED:-true}
      AMQP_GLOBAL_EVENTS: ${AMQP_GLOBAL_EVENTS:-messages.upsert,messages.update,connection.update}
      AMQP_SPECIFIC_EVENTS: ${AMQP_SPECIFIC_EVENTS:-}

      # NATS (desabilitado)
      NATS_URL: ""
      NATS_GLOBAL_ENABLED: "false"
      NATS_GLOBAL_EVENTS: ""

      # ------------------------------------------------------------------
      # Armazenamento de mídia — AWS S3 (cliente S3-compatible, prefixo MINIO_*)
      # Endpoint regional da AWS, SEM https:// e SEM o nome do bucket:
      #   s3.us-east-1.amazonaws.com
      # MINIO_USE_SSL deve ser "true" para a AWS.
      # Credenciais: use um IAM user com permissão no bucket
      # (s3:PutObject, s3:GetObject, s3:DeleteObject, s3:ListBucket).
      # ------------------------------------------------------------------
      MINIO_ENABLED: ${MINIO_ENABLED:-true}
      MINIO_ENDPOINT: ${S3_ENDPOINT:-s3.us-east-1.amazonaws.com}
      MINIO_ACCESS_KEY: ${S3_ACCESS_KEY:?defina S3_ACCESS_KEY no .env}
      MINIO_SECRET_KEY: ${S3_SECRET_KEY:?defina S3_SECRET_KEY no .env}
      MINIO_BUCKET: ${S3_BUCKET:?defina S3_BUCKET no .env}
      MINIO_USE_SSL: ${S3_USE_SSL:-true}
      MINIO_REGION: ${S3_REGION:-us-east-1}

      # Eventos
      EVENT_IGNORE_GROUP: "false"
      EVENT_IGNORE_STATUS: "true"

      # QR Code
      QRCODE_MAX_COUNT: "5"

      # Verificação de Usuário
      CHECK_USER_EXISTS: "true"

    volumes:
      - evolution_data:/app/dbdata
      - evolution_logs:/app/logs
    networks:
      - dokploy-network

volumes:
  evolution_data:
    driver: local
  evolution_logs:
    driver: local
